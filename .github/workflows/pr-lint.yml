name: PR Lint

# Run on pull request events: new PR, reopen, and updates (push to the PR branch)
on:
  pull_request:
    types: [opened, reopened, synchronize]

# single job that installs dependencies and runs lint
jobs:
  lint:
    name: Run ESLint (npm run lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        # if your lint script is in package.json as "lint": "eslint ..." then this will run it
        run: npm run lint
