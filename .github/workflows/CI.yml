name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint-and-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings=10

      - name: Check formatting with Prettier
        run: npx prettier --check .

      - name: Run tests with coverage
        # Run tests and produce coverage. If tests fail this step will fail the job
        run: |
          npm test -- \
            --coverage \
            --coverageReporters=json-summary \
            --coverageDirectory=coverage \
            --runInBand \
            --json --outputFile=jest-results.json
        env:
          CI: 'true'

      - name: Verify coverage threshold (70% lines)
        run: |
          node -e "
          const fs = require('fs');
          const path = 'coverage/coverage-summary.json';
          if (!fs.existsSync(path)) {
            console.error('coverage summary not found at', path);
            process.exit(1);
          }
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
          const pct = summary.total.lines.pct;
          const min = 70;
          console.log('Coverage (lines):', pct + '%');
          if (pct < min) {
            console.error(`Coverage ${pct}% is below required ${min}%`);
            process.exit(1);
          }
          console.log('Coverage threshold met');
          "
